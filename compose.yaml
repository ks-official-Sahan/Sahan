# Production stack for one host (a VPS). The app image comes from GHCR; the
# deploy job (scripts/deploy/deploy.sh) sets SAHAN_IMAGE to an exact digest.
#
#   docker compose up -d --wait                  app only (behind your own proxy)
#   docker compose --profile proxy up -d --wait  plus Caddy with automatic HTTPS
#   docker compose --profile cron up -d          plus the daily cron jobs
#
# Secrets live in .env.production on the host (never in the image or here).

name: sahan

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  app:
    <<: *hardening
    image: ${SAHAN_IMAGE:-ghcr.io/ks-official-sahan/sahan:latest}
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://sahansachintha.com}
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # One proxy (Caddy, or yours) sets x-forwarded-for; the port below only
      # listens on localhost, so nothing else can reach the app directly.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
    # Bound to localhost: the proxy (or your own) is the only way in.
    ports:
      - "127.0.0.1:3000:3000"
    # Writable scratch for the image optimizer, ISR and Node temp files.
    tmpfs:
      - /app/.next/cache:uid=65532,gid=65532,mode=0755,size=512m
      - /tmp:uid=65532,gid=65532,mode=1777,size=64m
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    # SIGTERM drains in-flight requests and after() callbacks before exit.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
        reservations:
          memory: 256m

  caddy:
    <<: *hardening
    profiles: [proxy]
    image: caddy:2.10-alpine
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-sahansachintha.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./scripts/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp

  cron:
    <<: *hardening
    profiles: [cron]
    image: busybox:1.37
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - path: .env.production
        required: false
    # The same schedule as vercel.json. The crontab is written into the
    # container's tmpfs at start; CRON_SECRET never touches the host disk again.
    tmpfs:
      - /var/spool/cron/crontabs
      - /tmp
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        : "$${CRON_SECRET:?CRON_SECRET is required}"
        call='wget -q -O /dev/null -T 300 --header "Authorization: Bearer '"$$CRON_SECRET"'" http://app:3000/api/cron'
        {
          echo "0 2 * * * $$call/blog-publish"
          echo "5 2 * * * $$call/session-cleanup"
          echo "10 2 * * * $$call/audit-prune"
        } > /var/spool/cron/crontabs/root
        exec crond -f -d 8 -c /var/spool/cron/crontabs

volumes:
  caddy-data:
  caddy-config:
