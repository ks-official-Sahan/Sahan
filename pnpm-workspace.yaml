packages:
  - '.'
  - 'packages/*'
  - 'examples/*'

publicHoistPattern:
  - '*@nextui-org/*'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@tsparticles/engine': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  workerd: true

# One React for the whole workspace: two copies break hooks and RSC, and vinext
# needs react-server-dom-webpack at exactly the React version.
overrides:
  react: 19.3.1
  react-dom: 19.3.1
  react-server-dom-webpack: 19.3.1

minimumReleaseAgeExclude:
  - '@cloudflare/build-output-utils@0.9.9'
  - '@cloudflare/config@0.30.1'
  - '@cloudflare/runtime-types@0.1.22'
  - '@cloudflare/vite-plugin@2.0.0-beta.v.11'
  - '@cloudflare/workerd-darwin-64@1.20261103.1'
  - '@cloudflare/workerd-darwin-arm64@1.20261103.1'
  - '@cloudflare/workerd-linux-64@1.20261103.1'
  - '@cloudflare/workerd-linux-arm64@1.20261103.1'
  - '@cloudflare/workerd-windows-64@1.20261103.1'
  - '@cloudflare/workers-response-store@1.1.5'
  - '@vinext/cloudflare@1.3.2'
  - miniflare@5.20261103.0-beta
  - vinext@1.4.2
  - workerd@1.20261103.1
